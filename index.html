<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML to JSON</title>
    <script src="html2json.js"></script>
    <style>
      h1 {
        font-family: sans-serif
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .container {
        display: flex;
        width: 100%;
        gap: 10px;
      }

      .field {
        display: flex;
        flex-direction: column;
        width: 50%;
      }

      textarea {
        width: 100%;
        height: calc(100vh - 270px);
        max-width: 100%;
        white-space: pre;
      }

      .buttons {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }

      .row1 {
        background-color: pink;
      }

      .row2 {
        background-color: yellow;
      }

      .row3 {
        background-color: yellowgreen;
      }

      button {
        width: 150px;
        height: 40px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Jito's Software Developer Intern "html2json" Test Task</h1>

    <div class="container">
      <div class="field">
        <label for="html">Input for "html2json" conversion:</label>
        <textarea id="html" placeholder="Enter your HTML"></textarea>
      </div>
      <div class="field">
        <label for="json">Results of "html2json" conversion:</label>
        <textarea disabled id="json" placeholder="Here will be output from your html2json function"></textarea>
      </div>
    </div>
    <div class="buttons">
      <div>
        <button class="row1" onclick="convertHtml2JsonAndSet()">Convert to JSON</button>
      </div>

      <div>
        <button class="row2"onclick="showExample1()">Input Example 1</button>
        <button class="row2" onclick="showExample2()">Input Example 2</button>
      </div>
    
      <div>
        <button class="row3" onclick="simple_test()">Simple test</button>
        <button class="row3" onclick="nested_test()">Nested test</button>
        <button class="row3" onclick="broken_test()">Broken test</button>

        <button class="row3" onclick="script_style_test()">Script style test</button>
        <button class="row3" onclick="table_case_test()">Table case test</button>
        <button class="row3" onclick="self_closing_test()">Self closing test</button>
        <button class="row3" onclick="comment_doctype_test()">Comment doctype test</button>
        <button class="row3" onclick="long_text_test()">Long text test</button>
        <button class="row3" onclick="stress_test_test()">Stress test</button>
      </div>
    </div>
  </body>
</html>
